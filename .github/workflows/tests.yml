name: tests

on:
  push:
    # Branches only.  An unfiltered "push" also fires for tag pushes, so every
    # release ran the whole matrix twice on the same commit.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    name: unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  validation:
    name: validation suite and package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run the example
        run: python examples/basic_usage.py
      - name: Run the validation suite
        run: python validation/validation_suite.py
      - name: Build the package
        run: python -m build
      - name: List built artifacts
        run: ls -l dist
